; Production-only PHP settings, loaded after docker/php.ini (shared with the
; development image) as conf.d/zzz-baraka-bozor-prod.ini. Set by W4-2
; (DL-104 (3)).

; Opcache is what makes PHP-FPM fast; it is off by default in the CLI-oriented
; base image.
opcache.enable=1

; The code never changes inside a running container: a release is a new image.
; Skipping the timestamp stat on every include removes a syscall per file.
opcache.validate_timestamps=0

; Room for the framework and its vendor tree (measured needs are far below this).
opcache.memory_consumption=128

; Deduplicated strings shared by all workers; the default of 8 is small for a
; Laravel application.
opcache.interned_strings_buffer=16

; Above the file count of the vendor tree, so no file is ever evicted for lack
; of a slot.
opcache.max_accelerated_files=20000

; Caches resolved paths; with immutable code a long lifetime is safe.
realpath_cache_size=4096K
realpath_cache_ttl=600

; The shared 512M is sized for PHPStan; 12 FPM children on a 4 GB server need
; a request ceiling a runaway request cannot push past.
memory_limit = 256M

; No X-Powered-By header: it tells a scanner the PHP version for nothing.
expose_php=Off
