# The production stack: Caddy in front of PHP-FPM, a queue worker, the scheduler
# and PostgreSQL (DL-104 (3)-(5), DL-107). The development stack stays in
# docker/compose.yaml; the two share nothing.
#
# Run it from the repository root, with one env file holding both the Compose
# variables and the application's (docker/production.env.example lists them):
#
#   docker compose --env-file <file> -f docker/compose.prod.yaml up -d --build
#
# Compose reads <file> to fill the ${...} below. BB_ENV_FILE names that same
# file, so the PHP services get it as their environment too. Caddy gets only the
# three values it needs, so no application secret reaches it.
#
# Only Caddy publishes ports. The database, PHP-FPM, the worker and the
# scheduler are unreachable from outside the stack.
#
# Two networks. `edge` joins Caddy and the app, and has a fixed subnet: that
# subnet is TRUSTED_PROXIES, so the application trusts a forwarded client
# address only from that range. Caddy's FastCGI transport already passes the
# client's own address; the trust matters when the peer is the edge network's
# gateway (Docker Desktop, a Docker userland proxy) or an HTTP proxy hop
# (DL-107 (4)).
#
# `internal` joins the PHP services and the database; the app and the worker
# also reach Telegram and Firebase through it. Caddy is not on it, so a
# compromised proxy cannot reach the database.
name: ${COMPOSE_PROJECT_NAME:-barakabozor}

x-logging: &logging
  # Without a cap a container's log grows until the disk is full.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-php: &php
  build:
    # The backend as the context, the runtime files of docker/ as the named
    # additional context the Dockerfile copies from.
    context: ../backend
    dockerfile: ../docker/app.prod.Dockerfile
    additional_contexts:
      runtime: .
  image: barakabozor-app:${BB_RELEASE:-latest}
  env_file: ${BB_ENV_FILE:?BB_ENV_FILE must name the env file passed to --env-file}
  environment:
    # One value for the subnet and for the trust: it overrides the env file.
    TRUSTED_PROXIES: ${EDGE_SUBNET:?EDGE_SUBNET must be a private subnet no other network on the server uses}
  # A worker that exits after --max-time must come back.
  restart: unless-stopped
  # tini, so SIGTERM reaches the process and a stop does not wait out the grace
  # period.
  init: true
  depends_on:
    db:
      condition: service_healthy
  networks:
    - internal
  logging: *logging

services:
  app:
    <<: *php
    networks:
      - edge
      - internal
    volumes:
      # The product images the application writes and Caddy serves.
      - public-images:/app/storage/app/public
    healthcheck:
      # FPM speaks FastCGI, not HTTP, so the check is that the port accepts.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=3", "--max-time=3600"]
    # Long enough for a job in flight to finish after SIGTERM.
    stop_grace_period: 60s

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # What the development database has: DL-20 needs a UTF-8 character type.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the unix socket: while the image runs its first-start
      # scripts a temporary server is up on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    ports:
      # TCP only: UDP 443 stays closed, so HTTP/3 is not offered.
      - "${BB_PUBLISH_ADDRESS:-0.0.0.0}:${BB_HTTP_PORT:-80}:80"
      - "${BB_PUBLISH_ADDRESS:-0.0.0.0}:${BB_HTTPS_PORT:-443}:443"
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
      PANEL_HOST: ${PANEL_HOST:?PANEL_HOST is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates: losing them meets Let's Encrypt's rate limits.
      - caddy-data:/data
      - caddy-config:/config
      - public-images:/srv/storage:ro
      - ${PANEL_ROOT:?PANEL_ROOT must be the directory holding the panel releases}:/srv/panel:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging: *logging

  # The nightly encrypted backup (DL-104 (6)). A profile, so a scratch or
  # development stack that reuses this file never writes the production
  # repository; production turns it on with COMPOSE_PROFILES=backup. Its own env
  # file, never the app's: a leaked backup credential must not open the
  # application. The images mount is read-only, so a fault here cannot alter
  # them.
  backup:
    profiles: [backup]
    build:
      context: ./backup
    image: barakabozor-backup:${BB_RELEASE:-latest}
    env_file: ${BACKUP_ENV_FILE:?BACKUP_ENV_FILE must name the backup env file (docker/backup.env.example)}
    environment:
      PGHOST: db
      PGDATABASE: ${DB_DATABASE:?DB_DATABASE is required}
    volumes:
      # nocopy: Docker gives an empty volume the owner of the mounting image's
      # directory, and only the app's image may set it (www-data), or uploads
      # fail.
      - type: volume
        source: public-images
        target: /backup/images
        read_only: true
        volume:
          nocopy: true
      # The last result of each job.
      - backup-status:/status
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    init: true
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?EDGE_SUBNET must be a private subnet no other network on the server uses}
  internal:

volumes:
  db-data:
  public-images:
  caddy-data:
  caddy-config:
  backup-status:
