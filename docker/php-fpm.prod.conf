; PHP-FPM pool for production, loaded after the base image's own pool files as
; php-fpm.d/zz-baraka-bozor.conf so its values win (DL-104 (3)).
[www]

; Without this FPM hands PHP an empty environment and the container's APP_KEY,
; DB_PASSWORD and the rest never reach Laravel.
clear_env = no

; No access log: Caddy keeps none either (DL-104 (3)), and a request line must
; never be able to carry a token or a phone number into a log.
access.log = /dev/null

; Sized for the 4 GB server of the Owner gate: 12 workers at roughly 100 MB
; each leave room for PostgreSQL and the proxy.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycles a worker after 500 requests so a slow leak cannot grow without bound.
pm.max_requests = 500
