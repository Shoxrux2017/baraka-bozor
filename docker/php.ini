; PHP settings this project sets deliberately. Everything not listed here is
; left at the base image's default on purpose.
;
; The php:8.4-cli image ships no active php.ini. It places php.ini-development
; and php.ini-production in /usr/local/etc/php/ and expects the build to choose
; one. Choosing neither is not a neutral default: every process then runs under
; PHP's compiled-in fallbacks, and this file exists because one of those
; fallbacks was wrong for this project rather than merely unconfigured.
;
; Copied to conf.d/ rather than replacing php.ini, so that what this project
; sets stays readable next to what it inherits. See docker/README.md.

; PHPStan analysing this Laravel application runs close to PHP's 128M fallback.
; Measured on main before this file existed: 94.5 MB in the main process and
; 114 MB in the parallel worker. Fourteen megabytes of headroom on a branch that
; passed, and single-process analysis (--debug) exceeded the fallback outright,
; dying with "Allowed memory size of 134217728 bytes exhausted".
;
; `php artisan test` ran under the same ceiling and would have reached it in a
; later wave, where a fatal error in a forked worker is reported only as
; "Child process error (exit code 255)", naming no file.
;
; 512M is about four and a half times the measured peak, so it is headroom for
; several waves rather than a number to revisit each wave, and it is the value
; PHPStan's own documentation recommends for a Laravel project.
;
; Set by the approved Wave 0 task W0-INT-004.
memory_limit = 512M
