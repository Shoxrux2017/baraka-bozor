; PHP settings this project sets deliberately. Everything not listed here is
; left at the base image's default on purpose.
;
; The php:8.4-cli image activates no php.ini at all: it places
; php.ini-development and php.ini-production in /usr/local/etc/php/ and expects
; the build to choose one. This file is copied to conf.d/ rather than choosing
; one of those, because they set dozens of unrelated values and - measured in
; this container - both set memory_limit = 128M themselves, identical to PHP's
; compiled-in fallback. Activating either would have changed nothing here. The
; main php.ini therefore stays absent by design; `php --ini` reports
; "Loaded Configuration File: (none)" and lists this file under
; "Additional .ini files parsed". See docker/README.md.

; 128M is PHP's documented default rather than an accident, and it is not enough
; for this project. PHPStan's peak here straddles it: `analyse --debug` was
; observed at 170.5 MB on a freshly built image, and at 126.5 MB whenever the
; 128M ceiling was the limit - PHP's allocator collects harder under a tight
; limit rather than the work getting smaller. 128M was the wall, not headroom.
;
; --debug is single-process, and it is the one mode that makes PHPStan name the
; file it died on, so it is exactly what anyone reaches for when the analyser
; crashes. On the W0-BE-010 branch, which adds two analysed files, it does not
; survive 128M at all: "Allowed memory size of 134217728 bytes exhausted". A
; diagnostic tool that cannot run when there is something to diagnose is the
; defect this fixes.
;
; These peaks move by tens of megabytes with container state, so no single figure
; here is "the" number; the task contract records the ranges and sample counts.
; In particular this is NOT a claim about the parallel-worker failure CI reports
; on that branch, which the observed range neither confirms nor excludes.
;
; 512M is about three times the highest peak observed: headroom for several waves
; rather than a number to revisit each wave.
;
; Set by the approved Wave 0 task W0-INT-004.
memory_limit = 512M

; Uploads. PHP's defaults (upload_max_filesize = 2M, post_max_size = 8M) are
; below the 5 MiB product image `docs/09` section 16 promises, so a phone
; photo of 3 MiB was refused before the application saw it. 6M leaves room
; above the 5 MiB rule the application enforces itself; post_max_size must
; exceed it by the multipart overhead. A body above post_max_size answers
; `413 payload_too_large` (`DL-21`). Set by Wave 1 task W1-4.
upload_max_filesize = 6M
post_max_size = 8M

; An API never answers with a PHP warning rendered as HTML: errors go to the
; log, and the client receives the JSON envelope. Set by Wave 1 task W1-4.
display_errors = Off

; A stack trace never carries argument values. At PHP's built-in default (Off)
; every string argument of up to 15 characters is written into a trace, and a
; trace is what the error log keeps: a staff password, a temporary password or a
; login code passed down the call stack would land in the log whenever something
; failed below it (`AGENTS.md` section 5). The sensitive parameters are also
; marked #[\SensitiveParameter]; this covers the frames of code that is not
; ours. Set by Wave 1 task W1-7.
zend.exception_ignore_args = On
