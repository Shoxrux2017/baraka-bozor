<!doctype html>
<!-- The Google Play feature graphic, 1024x500. Rendered to
     feature-graphic-1024x500.png with headless Chrome at exactly that window
     size (DL-116 (11)); the mark is the Owner's artwork from source/. -->
<html lang="uz">
<head>
<meta charset="utf-8">
<title>BarakaBozor feature graphic</title>
<style>
  @font-face { font-family: 'Montserrat'; src: url('../../../frontend/assets/fonts/Montserrat-Variable.ttf') format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: radial-gradient(130% 150% at 22% 50%, #FFFFFF 0%, #F1F8E9 45%, #DDEFCB 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 0 0 96px; box-sizing: border-box;
  }
  .mark { width: 330px; height: 330px; flex: none; filter: drop-shadow(0 14px 26px rgba(10, 80, 30, .18)); }
  .mark img { width: 100%; height: 100%; display: block; }
  .word { font-weight: 900; font-size: 92px; line-height: .98; letter-spacing: -2px; }
  .g { color: #0B6B2B; }
  .o { color: #F47B20; }
  .tag { margin-top: 26px; font-weight: 700; font-size: 30px; color: #1F4D2A; }
  .tag2 { margin-top: 8px; font-weight: 600; font-size: 24px; color: #4F6B55; }
</style>
</head>
<body>
  <div class="mark"><img src="source/baraka-bozor-mark-2048.png" alt=""></div>
  <div>
    <div class="word"><span class="g">Baraka</span><br><span class="o">Bozor</span></div>
    <div class="tag">Bozordan uyingizgacha</div>
    <div class="tag2">С базара — к вашей двери</div>
  </div>
</body>
</html>
